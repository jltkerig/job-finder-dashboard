<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Résumé Builder | Job Finder{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <nav class="top-nav" aria-label="Main navigation"><div class="nav-inner">
    <a class="nav-link" href="{{ job_finder_url }}/">Search</a>
    <a class="nav-link" href="{{ job_finder_url }}/dashboard">Dashboard</a>
    <a class="nav-link active" href="{{ url_for('index') }}">Résumé Builder</a>
    <a class="nav-link" href="{{ job_finder_url }}/rejected-listings">Settings</a>
    <a class="nav-link" href="{{ job_finder_url }}/tuning">Tuning</a>
  </div></nav>
  <header><div class="header-content"><div>{% block header %}{% endblock %}</div></div></header>
  <main>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<p class="flash flash-{{ category }}" role="status">{{ message }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>
  <footer>Résumé Builder v{{ app_version }}</footer>
  <script src="{{ url_for('static', filename='titles.js') }}"></script>
  <script src="{{ url_for('static', filename='design.js') }}"></script>
</body>
</html>
